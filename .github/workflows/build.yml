name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Build Project
        run: |
          # 1. Initialize Flutter template
          flutter create . --org com.focusstudy.app --project-name focus_study || true

          # 2. Setup lib folder structure
          mkdir -p lib/services lib/state lib/ui lib/screens lib/models lib/data
          cp lib/alarm_service.dart lib/services/ 2>/dev/null || true
          cp lib/notification_service.dart lib/services/ 2>/dev/null || true
          cp lib/focus_mode_service.dart lib/services/ 2>/dev/null || true
          cp lib/study_controller.dart lib/state/ 2>/dev/null || true
          cp lib/home_shell.dart lib/ui/ 2>/dev/null || true
          cp lib/home_shell.dart lib/screens/ 2>/dev/null || true
          cp lib/timer_screen.dart lib/ui/ 2>/dev/null || true
          cp lib/timer_screen.dart lib/screens/ 2>/dev/null || true
          cp lib/timetable_screen.dart lib/ui/ 2>/dev/null || true
          cp lib/timetable_screen.dart lib/screens/ 2>/dev/null || true
          cp lib/summary_screen.dart lib/ui/ 2>/dev/null || true
          cp lib/summary_screen.dart lib/screens/ 2>/dev/null || true
          cp lib/models.dart lib/models/ 2>/dev/null || true
          cp lib/database_helper.dart lib/data/ 2>/dev/null || true

          # 3. Auto-fix Flutter 3 compatibility in Dart
          python3 -c "
          import glob, re

          for p in glob.glob('**/*.dart', recursive=True):
              with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                  c = f.read()
              c2 = re.sub(r'\bCardTheme\(', 'CardThemeData(', c)
              if c2 != c:
                  with open(p, 'w', encoding='utf-8') as f:
                      f.write(c2)

          for p in glob.glob('**/*notification*.dart', recursive=True):
              with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                  c = f.read()
              if 'zonedSchedule(' in c and 'uiLocalNotificationDateInterpretation' not in c:
                  c2 = re.sub(
                      r'(zonedSchedule\s*\()',
                      r'\1uiLocalNotificationDateInterpretation: UILocalNotificationDateInterpretation.absoluteTime, ',
                      c
                  )
                  with open(p, 'w', encoding='utf-8') as f:
                      f.write(c2)
          "

          # 4. Clean duplicate MainActivity and configure Android files cleanly
          if [ -f AndroidManifest.xml ]; then
            mkdir -p android/app/src/main
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          if [ -f MainActivity.kt ]; then
            # Detect package name from MainActivity.kt or use default
            PKG=$(grep -E "^package " MainActivity.kt | head -n 1 | sed 's/package //' | tr -d ' ;')
            if [ -z "$PKG" ]; then
              PKG="com.focusstudy.app.focus_study"
              sed -i "1s/^/package $PKG\n\n/" MainActivity.kt
            fi

            # Delete all auto-generated template MainActivity files to prevent duplicates
            rm -rf android/app/src/main/kotlin/*
            rm -rf android/app/src/main/java/*

            # Place user's MainActivity in exact package path
            PKG_DIR="android/app/src/main/kotlin/$(echo $PKG | tr '.' '/')"
            mkdir -p "$PKG_DIR"
            cp MainActivity.kt "$PKG_DIR/MainActivity.kt"

            # Sync namespace in build.gradle
            sed -i "s/namespace = .*/namespace = \"$PKG\"/" android/app/build.gradle 2>/dev/null || true
            sed -i "s/applicationId = .*/applicationId = \"$PKG\"/" android/app/build.gradle 2>/dev/null || true
          fi

          # 5. Disable strict JVM validation
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=ignore" >> ~/.gradle/gradle.properties
          echo "kotlin.jvm.target.validation.mode=ignore" >> android/gradle.properties

          # 6. Build Release APK
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
