name: focus_study
description: Offline study stopwatch, timetable alarms and DND focus mode.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Local persistence (100% offline) ---
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # --- Alarms + notifications ---
  flutter_local_notifications: ^17.2.3
  android_alarm_manager_plus: ^4.0.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # --- Foreground service so the stopwatch survives app kill ---
  flutter_foreground_task: ^8.10.4

  # --- Permissions (DND / exact alarm / notifications) ---
  permission_handler: ^11.3.1

  # --- State + utils ---
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
